<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <div class="brand">
      <span class="brand-name">casio</span>
      <span class="brand-dot" id="powerDot"></span>
    </div>

    <div class="screen">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keys">
      <button class="key key--util" data-action="clear">clear</button>
      <button class="key key--util" data-action="sign">±</button>
      <button class="key key--util" data-action="percent">%</button>
      <button class="key key--op" data-action="divide">÷</button>

      <button class="key key--num" data-value="7">7</button>
      <button class="key key--num" data-value="8">8</button>
      <button class="key key--num" data-value="9">9</button>
      <button class="key key--op" data-action="multiply">×</button>

      <button class="key key--num" data-value="4">4</button>
      <button class="key key--num" data-value="5">5</button>
      <button class="key key--num" data-value="6">6</button>
      <button class="key key--op" data-action="subtract">−</button>

      <button class="key key--num" data-value="1">1</button>
      <button class="key key--num" data-value="2">2</button>
      <button class="key key--num" data-value="3">3</button>
      <button class="key key--op" data-action="add">+</button>

      <button class="key key--num key--zero" data-value="0">0</button>
      <button class="key key--num" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
